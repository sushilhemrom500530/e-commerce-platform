<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="brand-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366F1" />
            <stop offset="50%" stop-color="#5945F7" />
            <stop offset="100%" stop-color="#4338CA" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312E81" flood-opacity="0.3"/>
        </filter>
    </defs>
    <!-- Rounded Background Icon Base -->
    <rect width="64" height="64" rx="16" fill="url(#brand-grad)"/>
    
    <!-- Modern Shopping Bag Graphic -->
    <g filter="url(#shadow)">
        <!-- Bag Body -->
        <path d="M18 22H46L44 48C43.9 49.1 43 50 41.9 50H22.1C21 50 20.1 49.1 20 48L18 22Z" fill="white" />
        
        <!-- Bag Handle -->
        <path d="M26 24V18C26 14.686 28.686 12 32 12C35.314 12 38 14.686 38 18V24" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Inner Smile / Accent Curve in Indigo -->
        <path d="M27 30C27 32.76 29.24 35 32 35C34.76 35 37 32.76 37 30" stroke="#5945F7" stroke-width="2.5" stroke-linecap="round"/>
        
        <!-- Star / Sparkle in Top-Right -->
        <path d="M47 14L48.2 16.8L51 18L48.2 19.2L47 22L45.8 19.2L43 18L45.8 16.8L47 14Z" fill="#FDE047"/>
    </g>
</svg>
